{% extends 'main-base.html' %}
{% load static %}

{% block title %}首页{% endblock %}

{% block content %}
    <style>
        /* 收窄轮播图左右边距：抵消 .main-content(.col) 的 Bootstrap gutter 内边距 */
        .main-content #ad-banner {
            margin-left: -10px;
            margin-right: -12px;
        }
        /* 轮播图高度按 16:9 自适应容器宽度（宽度变化时高度自动等比缩放） */
        #ad-banner .carousel-inner {
            margin: 2px 0;
            width: 100%;
            aspect-ratio: 16 / 6;
        }
        #ad-banner .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 前后按钮更靠边：prev 图标靠左，next 图标靠右 */
        #ad-banner .carousel-control-prev {
            justify-content: flex-start;
            padding-left: 6px;
        }
        #ad-banner .carousel-control-next {
            justify-content: flex-end;
            padding-right: 6px;
        }

    </style>
    
    <!--横幅广告-->
    <div id="ad-banner" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#ad-banner" data-bs-slide-to="0" class="active" aria-label="广告横幅1"></button>
            <button type="button" data-bs-target="#ad-banner" data-bs-slide-to="1" aria-label="广告横幅2"></button>
            <button type="button" data-bs-target="#ad-banner" data-bs-slide-to="2" aria-label="广告横幅3"></button>
            <button type="button" data-bs-target="#ad-banner" data-bs-slide-to="3" aria-label="广告横幅4"></button>
            <button type="button" data-bs-target="#ad-banner" data-bs-slide-to="4" aria-label="广告横幅5"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img class="d-block w-100" src="{% get_media_prefix %}banner/banner.jpg" alt="广告横幅1">
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="{% get_media_prefix %}banner/banner1.jpg" alt="广告横幅2">
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="{% get_media_prefix %}banner/banner2.jpg" alt="广告横幅3">
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="{% get_media_prefix %}banner/banner3.jpg" alt="广告横幅4">
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="{% get_media_prefix %}banner/banner4.jpg" alt="广告横幅5">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#ad-banner" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">上一个</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#ad-banner" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">下一个</span>
        </button>
    </div>

    <!--页面主体-->
    <div class="containerr">
        <div class="model-details-title">
            <h4>主页页面标题</h4>
        </div>
        <div class="model-details">
            <p>这里是页面内容，先占位</p>
        </div>
    </div>





{% endblock %}
