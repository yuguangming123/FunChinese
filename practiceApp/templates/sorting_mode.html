{% extends "pra_base.html" %}{% load static %}
{% block title %}拆句重组-{{ lesson.name }}{% endblock %}
{% block content %}
<div class="practice-page"><div class="mode-panel active">
  <div class="content-area" id="sortingContentArea">
    <div class="sorting-toggles">
      <label class="toggle-switch">
        <input type="checkbox" id="toggleImage" checked>
        <span class="toggle-slider"></span>
        <span class="toggle-label">显示图片</span>
      </label>
      <label class="toggle-switch">
        <input type="checkbox" id="togglePinyin" checked>
        <span class="toggle-slider"></span>
        <span class="toggle-label">显示拼音</span>
      </label>
      <button type="button" class="sfx-btn" onclick="showSfxPanel()" style="display:inline-flex;align-items:center;gap:4px;border:none;background:#e8f5e9;color:#20c997;padding:2px 10px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:600;line-height:1.2;margin-left:auto;"><i class="fas fa-music" style="font-size:10px"></i>音效</button>
      <button class="sorting-help-btn" onclick="showSortingHelp()" title="操作帮助"><i class="fas fa-question-circle"></i></button>
    </div>
    <div class="sentence-image" id="sentenceImage"></div>
    <div class="sorting-words" id="sortingWords"></div>
    <div class="sorting-lines" id="sortingLines"></div>
  </div>
</div></div>
<style>
/* ===== 拆句重组：打乱词语（24px 橙色词块）===== */
.sorting-words {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 12px 16px; padding: 20px 24px; min-height: 80px; margin-top: 4px;
}
.sorting-word {
  display: inline-flex; flex-direction: column; align-items: center;
  font-size: 24px; font-weight: 700; color: #f57c00;
  padding: 8px 16px; background: #fff; border: 1px solid #f0d5b0;
  border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  cursor: pointer; user-select: none; line-height: 1.4; transition: all 0.15s;
}
.sorting-word .sw-pinyin {
  font-size: 16px; font-weight: 400; color: #20c997;
  line-height: 1.3; min-height: 1.3em; white-space: nowrap;
}
.sw-pinyin.hidden { display: none; }
.sorting-word:hover {
  border-color: #f57c00; box-shadow: 0 3px 12px rgba(245,124,0,0.18);
  transform: translateY(-1px);
}
/* ===== 拆句重组：横线槽（可选中/填入/撤销）===== */
.sorting-lines {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  column-gap: 2px; row-gap: 6px; padding: 16px 24px 28px; min-height: 60px;
}
.sorting-slot {
  display: inline-flex; align-items: center; justify-content: center;
  width: 56px; height: 60px; border-radius: 10px; position: relative;   /* 槽宽实际由 render() 按最长词统一设置 */
  cursor: pointer; user-select: none;
}
.sorting-slot .slot-line {
  position: absolute; bottom: 12px; height: 3px; border-radius: 2px;
  background: #ccc; transition: background 0.15s;
  left: 50%; transform: translateX(-50%); width: calc(100% - 12px);   /* 空线随槽宽等比缩放，两侧各留 6px */
}
.sorting-slot.filled .slot-line {
  background: #2563eb;   /* 蓝线：居中、宽度=词宽（JS 内联设置） */
}
.sorting-slot.selected .slot-line { background: #22c55e; animation: slot-blink 1s ease-in-out infinite; }
@keyframes slot-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
.sorting-slot .slot-word {
  position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 700; color: #2563eb;
  line-height: 1.4; white-space: nowrap; cursor: pointer;
}
/* 帮助按钮 */
.sorting-help-btn {
  background: none; border: none; color: #ccc;
  font-size: 20px; cursor: pointer; padding: 0 4px;
  transition: color 0.2s; display: flex; align-items: center;
}
.sorting-help-btn:hover { color: #20c997; }
/* 页面高度不足时：三大区块禁止被 flex 压缩，改由 content-area 垂直滚动展示全部内容（避免图片压扁、词卡重叠） */
.sentence-image, .sorting-words, .sorting-lines { flex-shrink: 0; }
/* 图片完整显示、保持原始宽高比（不裁剪、不变形），超出部分在框内留白 */
.sentence-image img { object-fit: contain; }
/* 横线间隙中的标点：位置随原句固定、不参与打乱 */
.sorting-punct {
  font-size: 24px; font-weight: 700; color: #1a1a1a;
  line-height: 1; align-self: center; padding: 0 2px;
}
/* ===== 词语填入/撤销的滑动动画幽灵 ===== */
.sorting-ghost {
  position: fixed; z-index: 9999; pointer-events: none;
  transition: transform 0.28s cubic-bezier(.25,.8,.35,1), width 0.28s cubic-bezier(.25,.8,.35,1);
}
.sorting-ghost .ghost-chip {
  display: inline-flex; font-size: 24px; font-weight: 700; color: #2563eb;
  line-height: 1.4; white-space: nowrap; border-bottom: 3px solid #2563eb;
}
</style>
{% endblock %}
{% block extra_js %}
<script>
const EXERCISES_BY_MODE = {{ exercises_by_mode_json|safe }};
let sortingEx = [], sortingIdx = 0;

// 每题交互状态：sWords 内容词按原句顺序（正确答案），sOrder 洗牌后的词卡顺序
var sWords = [], sOrder = [], sSlots = [], sCursor = 0, sBusy = false, sValidateTimer = null;

function isPunctWord(w) {
    return w && !w.pinyin && !w.pos && !w.grammar;
}

// Fisher-Yates 洗牌
function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 每次 render 重建词卡后，按开关当前状态重新应用显隐
function applyToggleState(cls, id) {
    var cb = document.getElementById(id);
    document.querySelectorAll('.' + cls).forEach(function(el) { el.classList.toggle('hidden', !cb.checked); });
}

// ===== 音效：Web Audio 加载并播放真实 wav =====
var sndCtx = null, sndBufs = {};
function getSndCtx() {
    if (!sndCtx) sndCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (sndCtx.state === 'suspended') sndCtx.resume();
    if (sndCtx.state === 'interrupted') { sndCtx.close(); sndCtx = null; return getSndCtx(); }
    return sndCtx;
}
function loadSnd(name, url) {
    fetch(url).then(function(r) { return r.arrayBuffer(); })
        .then(function(b) { return getSndCtx().decodeAudioData(b); })
        .then(function(buf) { sndBufs[name] = buf; })
        .catch(function() {});
}
function playSnd(name) {
    var b = sndBufs[name];
    if (!b) return;
    try {
        var c = getSndCtx();
        var s = c.createBufferSource();
        s.buffer = b;
        var g = c.createGain();
        g.gain.value = 0.9;
        s.connect(g).connect(c.destination);
        s.start();
    } catch (e) {}
}

// ===== 填词/撤销音效：Web Audio 实时合成，可试听选用 =====
var SFX_PRESETS = {
    crisp: { name: '清脆', place: { type: 'sine',     f0: 600,  f1: 900,  dur: 0.12, vol: 0.5 },
                           undo:  { type: 'sine',     f0: 900,  f1: 600,  dur: 0.12, vol: 0.5 } },
    soft:  { name: '柔和', place: { type: 'triangle', f0: 440,  f1: 440,  dur: 0.20, vol: 0.4 },
                           undo:  { type: 'triangle', f0: 330,  f1: 330,  dur: 0.20, vol: 0.4 } },
    pop:   { name: '弹出', place: { type: 'square',   f0: 800,  f1: 800,  dur: 0.07, vol: 0.3 },
                           undo:  { type: 'square',   f0: 400,  f1: 400,  dur: 0.07, vol: 0.3 } },
    drop:  { name: '水滴', place: { type: 'sine',     f0: 1200, f1: 600,  dur: 0.18, vol: 0.5 },
                           undo:  { type: 'sine',     f0: 600,  f1: 300,  dur: 0.18, vol: 0.5 } }
};
function playActionSnd(kind, preset) {
    preset = preset || localStorage.getItem('sorting_sfx') || 'crisp';
    // 播放本地 sound 目录中预生成的 wav 音效（不再实时合成）
    playSnd(preset + '-' + kind);
}
function previewSfx(key, kind) { playActionSnd(kind, key); }
function chooseSfx(key) { localStorage.setItem('sorting_sfx', key); showSfxPanel(); }
function showSfxPanel() {
    var cur = localStorage.getItem('sorting_sfx') || 'crisp';
    var html = '';
    for (var key in SFX_PRESETS) {
        var p = SFX_PRESETS[key], sel = key === cur;
        html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:2px solid ' + (sel ? '#20c997' : '#eee') + ';border-radius:10px;margin-bottom:8px;background:' + (sel ? '#e8f5e9' : '#fff') + ';">';
        html += '<span style="font-size:15px;font-weight:700;color:#1a1a1a;">' + p.name + (sel ? ' <span style="color:#20c997;">✓</span>' : '') + '</span>';
        html += '<span style="display:flex;gap:6px;">';
        html += '<button onclick="previewSfx(\'' + key + '\',\'place\')" style="padding:6px 12px;border:1px solid #20c997;background:#fff;color:#20c997;border-radius:6px;cursor:pointer;font-size:13px;">试听填入</button>';
        html += '<button onclick="previewSfx(\'' + key + '\',\'undo\')" style="padding:6px 12px;border:1px solid #20c997;background:#fff;color:#20c997;border-radius:6px;cursor:pointer;font-size:13px;">试听撤销</button>';
        html += '<button onclick="chooseSfx(\'' + key + '\')" style="padding:6px 14px;border:none;background:' + (sel ? '#20c997' : '#f5f5f5') + ';color:' + (sel ? '#fff' : '#888') + ';border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;">' + (sel ? '已选用' : '选用') + '</button>';
        html += '</span></div>';
    }
    Swal.fire({ title: '音效选择', html: html, showConfirmButton: false, showCloseButton: true, width: 520 });
}

document.addEventListener('DOMContentLoaded', function() {
    sortingEx = EXERCISES_BY_MODE['sorting'] || [];
    if (!sortingEx.length) return;

    function applyToggle(cls, show) {
        document.querySelectorAll('.' + cls).forEach(function(el) { el.classList.toggle('hidden', !show); });
    }
    function initToggle(id, cls) {
        var cb = document.getElementById(id);
        var saved = localStorage.getItem('sorting_' + id);
        if (saved === '0') { cb.checked = false; applyToggle(cls, false); }
        cb.addEventListener('change', function() {
            var on = cb.checked;
            localStorage.setItem('sorting_' + id, on ? '1' : '0');
            applyToggle(cls, on);
        });
    }
    initToggle('toggleImage', 'sentence-image');
    initToggle('togglePinyin', 'sw-pinyin');

    // 首次用户手势解锁音频上下文并预加载完成/错误音效（避免自动播放策略警告）
    var sndLoaded = false;
    ['pointerdown', 'keydown'].forEach(function(ev) {
        document.addEventListener(ev, function() {
            getSndCtx();
            if (!sndLoaded) {
                sndLoaded = true;
                loadSnd('complete', '{% static "sound/complete.wav" %}');
                loadSnd('error', '{% static "sound/error.wav" %}');
                // 预加载音效设置中的 8 个 wav（crisp/soft/pop/drop × place/undo）
                ['crisp', 'soft', 'pop', 'drop'].forEach(function(p) {
                    ['place', 'undo'].forEach(function(k) {
                        loadSnd(p + '-' + k, '{% static "sound/" %}' + p + '-' + k + '.wav');
                    });
                });
            }
        }, { once: true, passive: true });
    });

    // 事件委托：DOM 重建后仍生效
    document.getElementById('sortingLines').addEventListener('click', function(e) {
        var slot = e.target.closest('.sorting-slot');
        if (slot) onSlotClick(parseInt(slot.getAttribute('data-slot'), 10));
    });
    document.getElementById('sortingWords').addEventListener('click', function(e) {
        var card = e.target.closest('.sorting-word');
        if (card) placeWord(parseInt(card.getAttribute('data-idx'), 10));
    });
    // 键盘左右方向键移动光标
    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            e.preventDefault();
            moveCursorDir(e.key === 'ArrowLeft' ? -1 : 1);
        }
    });

    render();
    updateProgress();
});

function render() {
    if (!sortingEx.length) return;
    var q = sortingEx[sortingIdx];

    // 重置本题状态
    var analysis = q.word_analysis || [];
    sWords = analysis.filter(function(w) { return !isPunctWord(w); });
    sOrder = shuffle(sWords.map(function(_, i) { return i; }));
    sSlots = new Array(sWords.length).fill(null);
    sCursor = 0;
    sBusy = false;
    // 重渲染（切题/重置/成功跳题）时取消尚未触发的延迟验证，防止对错题误弹窗
    if (sValidateTimer) { clearTimeout(sValidateTimer); sValidateTimer = null; }

    // 1) 顶部图片（与 speaking 模式一致）
    var imgC = document.getElementById('sentenceImage');
    imgC.innerHTML = q.image_url
        ? '<img src="' + q.image_url + '" alt="sentence">'
        : '<div class="placeholder"><i class="fas fa-image"></i></div>';

    // 2) 词卡行：按洗牌顺序渲染（带拼音），放置的词卡 display:none 隐藏
    var wc = document.getElementById('sortingWords');
    if (sWords.length) {
        wc.innerHTML = sOrder.map(function(idx) {
            var w = sWords[idx];
            return '<div class="sorting-word" data-idx="' + idx + '">' +
                '<span class="sw-pinyin">' + escHtml(w.pinyin || '') + '</span>' +
                '<span class="sw-text">' + escHtml(w.word || '') + '</span>' +
            '</div>';
        }).join('');
    } else {
        wc.innerHTML = '<div style="color:#ccc;padding:30px;">暂无词语</div>';
    }

    // 3) 横线行：按原句顺序，内容词→交互槽、标点→间隙
    var lc = document.getElementById('sortingLines');
    var contentIdx = 0;
    lc.innerHTML = analysis.length ? analysis.map(function(w) {
        if (isPunctWord(w)) {
            return '<div class="sorting-punct">' + escHtml(w.word || '') + '</div>';
        }
        var html = '<div class="sorting-slot" data-slot="' + contentIdx + '">';
        html += '<span class="slot-line"></span>';
        html += '</div>';
        contentIdx++;
        return html;
    }).join('') : '';

    // 统一槽宽：按本题最长词预留，保证填入前后各槽宽度一致、水平间距不变
    var minSlotW = 56;
    document.querySelectorAll('.sorting-slot').forEach(function(el) { el.style.width = minSlotW + 'px'; });

    // 自动朗读整句
    if (q.chinese && localStorage.getItem('qwen3_auto_read') !== '0') {
        setTimeout(function() {
            VoicePlayer.startSpectrum('spectrumCanvas');
            VoicePlayer.speak(q.chinese);
        }, 300);
    }
    // 每次 render 重建词卡后，按开关当前状态重新应用显隐
    applyToggleState('sentence-image', 'toggleImage');
    applyToggleState('sw-pinyin', 'togglePinyin');
    updateSelection();
    updateProgress();
}

// 渲染单个槽：空态（灰线）/ 填态（蓝字 + 蓝线，线宽=词宽）
function renderSlot(slotEl, i) {
    if (!slotEl) return;
    var k = sSlots[i];
    if (k === null) {
        slotEl.classList.remove('filled');
        slotEl.innerHTML = '<span class="slot-line"></span>';
        slotEl.style.width = '56px';
    } else {
        var w = sWords[k];
        slotEl.classList.add('filled');
        var wid = (String(w.word || '').length * 24 + 8);
        slotEl.style.width = (wid + 12) + 'px';
        slotEl.innerHTML = '<span class="slot-word">' + escHtml(w.word || '') + '</span>' +
            '<span class="slot-line" style="width:' + wid + 'px"></span>';
    }
}

// 刷新选中态（绿闪）
function updateSelection() {
    var slots = document.querySelectorAll('.sorting-slot');
    for (var i = 0; i < slots.length; i++) {
        slots[i].classList.toggle('selected', i === sCursor);
    }
}

// 沿方向循环查找下一根空横线
function moveCursorDir(d) {
    var n = sSlots.length;
    if (!n) return;
    var cur = sCursor;
    for (var step = 0; step < n; step++) {
        cur = (cur + d + n) % n;
        if (sSlots[cur] === null) { sCursor = cur; updateSelection(); return; }
    }
}

// 点词卡 → 填入当前选中槽
function placeWord(k) {
    if (sBusy) return;
    if (sSlots[sCursor] !== null) return;
    var cardEl = document.querySelector('.sorting-word[data-idx="' + k + '"]');
    if (!cardEl) return;
    var fromRect = cardEl.getBoundingClientRect();
    var w = sWords[k];

    sSlots[sCursor] = k;
    cardEl.style.display = 'none';
    var slotEl = document.querySelector('.sorting-slot[data-slot="' + sCursor + '"]');
    renderSlot(slotEl, sCursor);
    var chip = slotEl.querySelector('.slot-word');
    void chip.offsetWidth;
    var toRect = chip.getBoundingClientRect();
    flyGhost(fromRect, toRect, '<span class="ghost-chip">' + escHtml(w.word || '') + '</span>');
    playActionSnd('place');

    var filled = 0;
    sSlots.forEach(function(v) { if (v !== null) filled++; });
    if (filled === sWords.length) {
        sBusy = true;   // 动画期间锁定交互，防止撤销打断
        sValidateTimer = setTimeout(function() { validate(); }, 340);   // 等 flyGhost(~320ms) 播完再验证
    } else {
        moveCursorDir(1);
        updateSelection();
    }
}

// 点已填槽的词 → 撤销回词卡原位置
function undoWord(i) {
    if (sBusy) return;
    var k = sSlots[i];
    if (k === null) return;
    var slotEl = document.querySelector('.sorting-slot[data-slot="' + i + '"]');
    var chip = slotEl.querySelector('.slot-word');
    var fromRect = chip.getBoundingClientRect();
    var w = sWords[k];

    sSlots[i] = null;
    renderSlot(slotEl, i);
    var cardEl = document.querySelector('.sorting-word[data-idx="' + k + '"]');
    cardEl.style.display = '';
    void cardEl.offsetWidth;
    var toRect = cardEl.getBoundingClientRect();
    flyGhost(fromRect, toRect, '<span class="ghost-chip">' + escHtml(w.word || '') + '</span>');
    playActionSnd('undo');

    sCursor = i;
    updateSelection();
}

// 点槽：空槽→选中，已填槽→撤销
function onSlotClick(i) {
    if (sBusy) return;
    if (sSlots[i] !== null) { undoWord(i); }
    else { sCursor = i; updateSelection(); }
}

// 滑动动画：从起点矩形飞一个词块幽灵到终点矩形
function flyGhost(fromRect, toRect, html) {
    var g = document.createElement('div');
    g.className = 'sorting-ghost';
    g.style.left = fromRect.left + 'px';
    g.style.top = fromRect.top + 'px';
    g.style.width = fromRect.width + 'px';
    g.innerHTML = html;
    document.body.appendChild(g);
    void g.offsetWidth;  // 强制回流后再应用 transition
    g.style.transform = 'translate(' + (toRect.left - fromRect.left) + 'px,' + (toRect.top - fromRect.top) + 'px)';
    g.style.width = toRect.width + 'px';
    setTimeout(function() { g.remove(); }, 320);
}

// 填满后自动验证
function validate() {
    sBusy = true;
    var q = sortingEx[sortingIdx];
    // sWords 按原句顺序，槽位 i 应放词下标 i
    var ok = sSlots.every(function(k, i) { return k === i; });
    if (ok) {
        playSnd('complete');
        Swal.fire({icon: 'success', title: '排列正确！', text: q.chinese || '', timer: 1600, showConfirmButton: false, confirmButtonColor: '#20c997'});
        setTimeout(function() {
            sBusy = false;
            if (sortingIdx < sortingEx.length - 1) { sortingIdx++; render(); }
            else { Swal.fire({icon: 'info', title: '已完成所有题目', confirmButtonColor: '#20c997'}); }
        }, 1700);
    } else {
        playSnd('error');
        Swal.fire({icon: 'error', title: '排列有误，请重试', text: q.chinese || '', timer: 1500, showConfirmButton: false, confirmButtonColor: '#20c997'});
        setTimeout(function() {
            // 保持词序：清空所有横线、词卡全部返回、光标回到第一根
            sSlots = new Array(sWords.length).fill(null);
            document.querySelectorAll('.sorting-word').forEach(function(el) { el.style.display = ''; });
            var slots = document.querySelectorAll('.sorting-slot');
            for (var i = 0; i < slots.length; i++) renderSlot(slots[i], i);
            sCursor = 0; sBusy = false;
            updateSelection();
        }, 1600);
    }
}

function updateProgress() {
    var total = sortingEx.length, idx = sortingIdx + 1, pct = total ? (idx / total * 100) : 0;
    document.getElementById('listeningProgressText').textContent = idx + '/' + total;
    document.getElementById('listeningProgressFill').style.width = pct + '%';
    document.getElementById('listeningCounter').textContent = idx + '/' + total;
    document.getElementById('listeningBottomFill').style.width = pct + '%';
}

function speakWordsSequentially(list, i) {
    if (!list || i >= list.length) return;
    // 逐词发音：cnchar 库驱动（真人预录音频 mp3），替代 Qwen3 TTS
    playCncharWord(list[i], function() {
        setTimeout(function() { speakWordsSequentially(list, i + 1); }, 1000);
    });
}

function listeningControl(action) {
    if (action === 'next') {
        if (sortingIdx < sortingEx.length - 1) { sortingIdx++; render(); }
        else { Swal.fire({icon:'info', title:'已完成所有题目', confirmButtonColor:'#20c997'}); }
    } else if (action === 'prev') {
        if (sortingIdx > 0) { sortingIdx--; render(); }
    } else if (action === 'play') {
        var q = sortingEx[sortingIdx];
        if (q && q.chinese) {
            VoicePlayer.startSpectrum('spectrumCanvas');
            VoicePlayer.speak(q.chinese);
        }
    } else if (action === 'word') {
        // 逐词朗读用原始（未打乱）顺序
        var q = sortingEx[sortingIdx];
        if (q && q.word_analysis && q.word_analysis.length) {
            var wl = q.word_analysis.map(function(w) { return w.word || ''; }).filter(Boolean);
            if (wl.length) speakWordsSequentially(wl, 0);
        }
    } else if (action === 'mastered') {
        toast('已掌握');
    } else if (action === 'unfamiliar') {
        toast('不熟悉');
    }
}

function toast(msg) {
    if (msg === '重置进度') {
        sortingIdx = 0; render();
        Swal.fire({title:'✅ 已重置', text:'已跳转到第一句', timer:1200, showConfirmButton:false, icon:'success'});
        return;
    }
    Swal.fire({title: msg, timer: 800, showConfirmButton: false, icon: 'info'});
}

function showContentList() {
    var all = EXERCISES_BY_MODE['sorting'] || [];
    if (!all.length) {
        Swal.fire({icon:'info', title:'暂无内容', text:'当前模式还没有练习题', confirmButtonColor:'#20c997'});
        return;
    }
    var html = '<div class="content-list">';
    all.forEach(function(ex, i) {
        html += '<div class="content-item" onclick="var s=Swal;s.close();sortingIdx=' + i + ';render();" style="cursor:pointer;padding:12px 16px;border-bottom:1px solid #f5f5f5;display:flex;gap:12px;align-items:flex-start;">';
        html += '<div style="width:28px;height:28px;border-radius:50%;background:#20c997;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;">' + (i+1) + '</div>';
        html += '<div style="flex:1;"><div style="font-size:17px;font-weight:600;color:#1a1a1a;">' + (ex.chinese || '') + '</div><div style="font-size:13px;color:#999;margin-top:1px;">' + (ex.english || '') + '</div></div>';
        html += '</div>';
    });
    html += '</div>';
    Swal.fire({title:'本课时句子列表', html:html, showConfirmButton:true, confirmButtonText:'关闭', confirmButtonColor:'#20c997', width:500, padding:'0 0 16px'});
}
