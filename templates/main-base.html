<!DOCTYPE html>
{% load static %}
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width,initial-scal=1"/>
    <title>趣学汉语&nbsp;|&nbsp;{% block title %}{% endblock %}</title>
    

    <link rel="stylesheet" href="{% static 'css/common.css' %}">
    <link rel="stylesheet" href="{% static 'css/nav_top.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
    <link rel="stylesheet" href="{% static 'plugins/font-awesome-7pro/css/all.css' %}">
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-5.3.2/css/bootstrap.min.css' %}"/>
    <script src="{% static 'plugins/bootstrap-5.3.2/js/bootstrap.bundle.min.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/nav_slider.css' %}">
    <script src="{% static 'plugins/canvasjs/canvasjs.min.js' %}"></script>

    <link rel="stylesheet" href="{% static 'css/course.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include 'main-navtop.html' %}
    <div class="container-fluid  justify-content-center">
        <div class="row main-body">
            <div class="col-auto fixed-sidebar" style="border: gainsboro 1px solid; border-radius: 6px; padding: 0">
                {% include 'main-navslider.html' %}
            </div>
            <div class="col main-content">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>
    {% include 'main-footer.html' %}
    {% block extra_js %}{% endblock %}
</body>
</html>
