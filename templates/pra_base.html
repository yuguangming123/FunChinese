<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta name="viewport" content="width=device-width,initial-scal=1"/>
<title>句子练习&nbsp;|&nbsp;{% block title %}{% endblock %}</title>
<link href="{% static 'plugins/font-awesome-7pro/css/all.css' %}" rel="stylesheet">
<link rel="stylesheet" href="{% static 'plugins/bootstrap-5.3.2/css/bootstrap.min.css' %}"/>
<script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
<script src="{% static 'plugins/sweetalert/sweetalert2.all.min.js' %}"></script>
<script src="{% static 'js/voice_player.js' %}"></script>
<script src="{% static 'plugins/spectrum-visualizer/spectrum-visualizer.js' %}"></script>
<script src="{% static 'plugins/cnchar/cnchar.min.js' %}"></script>
{% block extra_head %}{% endblock %}
<style>
body { margin: 0; background: #f8f9fa; }
.practice-wrapper { display: flex; flex-direction: column; height: 100vh; }
.bottom-spectrum { height: 40px; overflow: hidden; background: transparent; flex-shrink: 0; display: flex; justify-content: center; }
.bottom-spectrum canvas { display: block; max-width: 720px; width: 100%; height: 40px; }
.practice-page {
    padding: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
}

/* ========== 顶部菜单栏 ========== */
.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    background: #fff;
    border-bottom: 1px solid #f0f0f0;
    flex-shrink: 0;
}

.top-bar-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.top-bar-back {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px 6px 10px;
    border-radius: 20px;
    background: #f5f5f5;
    color: #666;
    cursor: pointer;
    text-decoration: none;
    font-size: 13px;
    transition: all 0.2s;
    white-space: nowrap;
}

.top-bar-back i { font-size: 16px; }

.top-bar-back:hover { background: #e8f5e9; color: #20c997; }

.top-bar-breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #999;
}

.top-bar-breadcrumb .breadcrumb-item {
    color: #999;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.top-bar-breadcrumb .breadcrumb-current {
    color: #1a1a1a;
    font-weight: 600;
}

.top-bar-breadcrumb .breadcrumb-sep {
    color: #ccc;
    font-size: 12px;
}

.top-bar-progress {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #bbb;
}
.top-bar-progress .bar {
    flex: 1;
    min-width: 160px;
    height: 3px;
    background: #f0f0f0;
    border-radius: 2px;
    overflow: hidden;
}

.top-bar-progress .bar .fill {
    height: 100%;
    background: linear-gradient(90deg, #20c997, #38d9a9);
    border-radius: 2px;
    transition: width 0.4s;
}

.top-bar-right {
    display: flex;
    gap: 4px;
}

.top-btn {
    border-radius: 6px;
    border: none;
    background: #f5f5f5;
    color: #888;
    cursor: pointer;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    gap: 5px;
    padding: 8px 16px;
    min-width: 50px;
    transition: all 0.2s;
    line-height: 1.3;
}

.top-btn i { font-size: 16px; }

.top-btn:hover { background: #e8f5e9; color: #20c997; }
.top-btn:active { background: #20c997; color: #fff; }

/* ========== 内容区 ========== */
.content-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 10px 24px;
    gap: 8px;
    overflow-y: auto;
    min-height: 0;
}

/* ---- 句子图片 ---- */
.sentence-image {
    width: 25%;
    align-self: center;
    aspect-ratio: 200 / 120;
    border-radius: 10px;
    overflow: hidden;
    background: #f8f9fa;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
}

.sentence-image img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

.sentence-image .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ccc;
    font-size: 32px;
    background: linear-gradient(135deg, #e8f5e9, #f0fdf4);
}

.analysis-groups {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 10px 14px;
    margin-bottom: 12px;
}

.analysis-word-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 0 0 auto;
}

.analysis-word-card {
    flex: 0 0 auto;
    background: #f8f9fb;
    border-radius: 10px;
    padding: 12px 18px 10px;
    border: 1px solid #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.analysis-word-card .aw-pinyin {
    font-size: 14px;
    color: #20c997;
    font-weight: 500;
    line-height: 1.2;
    text-align: center;
    width: 100%;
}

.analysis-word-card .aw-word {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.4;
    margin-top: 2px;
    text-align: center;
    width: 100%;
    padding-bottom: 4px;
    border-bottom: 2px solid rgba(0,0,0,0.1);
}

.analysis-word-card .aw-meaning {
    font-size: 13px;
    color: #f57c00;
    margin-top: 2px;
    line-height: 1.2;
    text-align: center;
    width: 100%;
}

.analysis-word-card .aw-grammar {
    font-size: 12px;
    padding: 1px 8px;
    border-radius: 4px;
    margin-top: 4px;
    color: #fff;
}
/* 语法成分颜色 - 填充整个词卡 */
.analysis-word-card.card-subject { background: #e3f2fd; border-color: #bbdefb; }
.analysis-word-card.card-subject .aw-grammar { background: #1565c0; }
.analysis-word-card.card-subject .aw-word { color: #1565c0; }

.analysis-word-card.card-predicate { background: #e8f5e9; border-color: #c8e6c9; }
.analysis-word-card.card-predicate .aw-grammar { background: #2e7d32; }
.analysis-word-card.card-predicate .aw-word { color: #2e7d32; }

.analysis-word-card.card-object { background: #fff3e0; border-color: #ffe0b2; }
.analysis-word-card.card-object .aw-grammar { background: #e65100; }
.analysis-word-card.card-object .aw-word { color: #e65100; }

.analysis-word-card.card-attributive { background: #fce4ec; border-color: #f8bbd0; }
.analysis-word-card.card-attributive .aw-grammar { background: #c62828; }
.analysis-word-card.card-attributive .aw-word { color: #c62828; }

.analysis-word-card.card-adverbial { background: #f3e5f5; border-color: #e1bee7; }
.analysis-word-card.card-adverbial .aw-grammar { background: #6a1b9a; }
.analysis-word-card.card-adverbial .aw-word { color: #6a1b9a; }

.analysis-word-card.card-complement { background: #e0f7fa; border-color: #b2ebf2; }
.analysis-word-card.card-complement .aw-grammar { background: #00695c; }
.analysis-word-card.card-complement .aw-word { color: #00695c; }

/* 无语法成分 - 默认灰色 */
.analysis-word-card.card-empty { background: #f5f5f5; border-color: #e0e0e0; }
.analysis-word-card.card-empty .aw-word { color: #605f5f; }
.analysis-word-card.card-empty .aw-pinyin { color: #bbb; }
.analysis-word-card.card-empty .aw-meaning { color: #bbb; }
.analysis-word-card.card-empty .aw-grammar { background: #ccc; color: #fff; }

.analysis-pos-card {
    flex: 0 0 auto;
    margin-top: 6px;
    font-size: 11px;
    color: #20c997;
    background: #e8f5e9;
    padding: 2px 12px;
    border-radius: 6px;
    text-align: center;
    min-width: 60px;
    font-weight: 500;
}

/* 标点容器：固定高度与词卡对齐 */
.analysis-punct-group {
    justify-content: flex-start !important;
    min-height: 120px;
}

/* 标点符号本身：无边框、无背景、24px 字号 */
.analysis-punct {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.4;
    padding: 0 2px;
    margin-top: 68px;
    /* 无边框、无背景、无任何装饰 */
}


/* ---- 完整句子 ---- */
.full-sentence {
    text-align: center;
}

.full-sentence .sentence-text {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 2px;
}

.full-sentence .sentence-pinyin {
    font-size: 16px;
    color: #20c997;
    margin-top: 4px;
}

.full-sentence .sentence-english {
    font-size: 16px;
    color: #999;
    margin-top: 4px;
}

/* ---- 句子解析按钮 ---- */
.grammar-hint-wrap {
    position: relative;
    display: inline-block;
    text-align: center;
    width: 100%;
}

.grammar-hint-btn {
    padding: 5px 20px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    background: #fff;
    color: #20c997;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
}

.grammar-hint-btn:hover { background: #e8f5e9; border-color: #20c997; }

.grammar-tooltip {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a;
    color: #fff;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.5;
    width: 280px;
    text-align: left;
    transition: all 0.2s;
    z-index: 10;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.grammar-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #1a1a1a;
}

.grammar-hint-btn:hover + .grammar-tooltip,
.grammar-tooltip:hover {
    visibility: visible;
    opacity: 1;
}

/* ---- 录音按钮 ---- */
.record-section {
    text-align: center;
    padding: 2px 0;
}

.record-btn-main {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 2px solid #e0e0e0;
    background: #fff;
    color: #999;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.record-btn-main:hover {
    border-color: #20c997;
    color: #20c997;
    box-shadow: 0 3px 12px rgba(32,201,151,0.2);
}

.record-label {
    font-size: 11px;
    color: #bbb;
    margin-top: 2px;
}

/* ---- 底部控制区 ---- */
.bottom-sticky {
    position: sticky;
    bottom: 0;
    z-index: 5;
}
.bottom-controls {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 -1px 8px rgba(0,0,0,0.04);
    padding: 8px 16px 10px;
    flex-shrink: 0;
}

/* ========== 夜间模式 ========== */
.theme-night { background: #000 !important; color: #e0e0e0 !important; }
.theme-night .top-bar { background: #000 !important; border-bottom-color: #222 !important; }
.theme-night .bottom-controls { background: #000 !important; }
.theme-night .content-area,
.theme-night .practice-page,
.theme-night .mode-panel,
.theme-night .full-sentence,
.theme-night .analysis-pos-card,
.theme-night .analysis-panel,
.theme-night .grammar-hint-wrap,
.theme-night .grammar-hint-btn { background: #0a0a0a !important; border-color: #222 !important; }
.theme-night .analysis-word-card { background: #141414 !important; border-color: #333 !important; color: #e0e0e0 !important; }
.theme-night .analysis-word-card.card-subject { background: #0d2137 !important; border-color: #1a3a5c !important; }
.theme-night .analysis-word-card.card-subject .aw-word { color: #64b5f6 !important; }
.theme-night .analysis-word-card.card-subject .aw-pinyin { color: #42a5f5 !important; }
.theme-night .analysis-word-card.card-subject .aw-meaning { color: #90caf9 !important; }
.theme-night .analysis-word-card.card-predicate { background: #0a2412 !important; border-color: #144a24 !important; }
.theme-night .analysis-word-card.card-predicate .aw-word { color: #81c784 !important; }
.theme-night .analysis-word-card.card-predicate .aw-pinyin { color: #66bb6a !important; }
.theme-night .analysis-word-card.card-predicate .aw-meaning { color: #a5d6a7 !important; }
.theme-night .analysis-word-card.card-object { background: #2a1608 !important; border-color: #4a2810 !important; }
.theme-night .analysis-word-card.card-object .aw-word { color: #ffb74d !important; }
.theme-night .analysis-word-card.card-object .aw-pinyin { color: #ffa726 !important; }
.theme-night .analysis-word-card.card-object .aw-meaning { color: #ffcc80 !important; }
.theme-night .analysis-word-card.card-attributive { background: #2a0a16 !important; border-color: #4a1828 !important; }
.theme-night .analysis-word-card.card-attributive .aw-word { color: #f06292 !important; }
.theme-night .analysis-word-card.card-attributive .aw-pinyin { color: #ec407a !important; }
.theme-night .analysis-word-card.card-attributive .aw-meaning { color: #f48fb1 !important; }
.theme-night .analysis-word-card.card-adverbial { background: #1a0a2a !important; border-color: #2a184a !important; }
.theme-night .analysis-word-card.card-adverbial .aw-word { color: #b39ddb !important; }
.theme-night .analysis-word-card.card-adverbial .aw-pinyin { color: #9575cd !important; }
.theme-night .analysis-word-card.card-adverbial .aw-meaning { color: #ce93d8 !important; }
.theme-night .analysis-word-card.card-complement { background: #06262a !important; border-color: #0e4a50 !important; }
.theme-night .analysis-word-card.card-complement .aw-word { color: #4dd0e1 !important; }
.theme-night .analysis-word-card.card-complement .aw-pinyin { color: #26c6da !important; }
.theme-night .analysis-word-card.card-complement .aw-meaning { color: #80deea !important; }
.theme-night .analysis-word-card.card-empty { background: #1a1a1a !important; border-color: #444 !important; }
.theme-night .analysis-word-card.card-empty .aw-word { color: #888 !important; }
.theme-night .analysis-word-card.card-empty .aw-pinyin { color: #666 !important; }
.theme-night .analysis-word-card.card-empty .aw-meaning { color: #666 !important; }
.theme-night .analysis-word-card.card-empty .aw-grammar { background: #555 !important; color: #eee !important; }
.theme-night .analysis-punct { color: #e0e0e0 !important; }
.theme-night .aw-grammar { color: #ccc !important; background: #222 !important; }
.theme-night .aw-word { border-bottom: 2px solid rgba(255,255,255,0.15) !important; }
.theme-night .top-bar-back,
.theme-night .top-bar-back span,
.theme-night .top-bar-breadcrumb .breadcrumb-item,
.theme-night .top-bar-breadcrumb .breadcrumb-current,
.theme-night .top-bar-progress span,
.theme-night .ctrl-btn span, .theme-night .ctrl-btn i,
.theme-night .progress-row .label,
.theme-night .progress-row .label-score,
.theme-night .grammar-hint-btn,
.theme-night .sentence-text,
.theme-night .sentence-pinyin,
.theme-night .sentence-english,
.theme-night .full-sentence,
.theme-night .aw-word,
.theme-night .aw-pinyin,
.theme-night .aw-meaning,
.theme-night .ci-chinese,
.theme-night .ci-english,
.theme-night .analysis-word-card,
.theme-night .analysis-pos-card,
.theme-night .analysis-groups,
.theme-night .analysis-word-group { color: #e0e0e0 !important; }
/* 按钮 */
.theme-night .top-bar-back,
.theme-night .top-btn,
.theme-night .ctrl-btn { background: #1a1a1a !important; color: #ccc !important; border-color: #333 !important; }
.theme-night .top-bar-back:hover,
.theme-night .top-btn:hover,
.theme-night .ctrl-btn:hover { background: #333 !important; color: #20c997 !important; }
.theme-night .top-bar-back:active,
.theme-night .top-btn:active,
.theme-night .ctrl-btn:active { background: #fff !important; color: #000 !important; }

.progress-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
}

.progress-row .bar-wrap {
    flex: 1;
    height: 4px;
    background: #f0f0f0;
    border-radius: 2px;
    overflow: hidden;
}

.progress-row .bar-wrap .fill {
    height: 100%;
    background: linear-gradient(90deg, #20c997, #38d9a9);
    border-radius: 2px;
    transition: width 0.4s;
}

.progress-row .label {
    font-size: 14px;
    font-weight: 600;
    color: #555;
    white-space: nowrap;
}
.progress-row .label-score {
    font-size: 14px;
    font-weight: 700;
    color: #20c997;
    white-space: nowrap;
}

.control-buttons {
    display: flex;
    justify-content: center;
    gap: 6px;
}

.ctrl-btn {
    border-radius: 8px;
    border: 1px solid #eee;
    background: #fff;
    color: #666;
    cursor: pointer;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    gap: 5px;
    padding: 8px 14px;
    min-width: 56px;
    transition: all 0.2s;
    line-height: 1.3;
}

.ctrl-btn i { font-size: 16px; }

.ctrl-btn:hover { background: #e8f5e9; border-color: #20c997; color: #20c997; }
.ctrl-btn:active { background: #20c997; color: #fff; border-color: #1aad85; }

.ctrl-btn.play {
    /* 继承 .ctrl-btn 全部样式，仅覆盖图标大小 */
}

.ctrl-btn.play i { font-size: 20px; }

/* ========== 模式面板容器 ========== */
.mode-panel {
    display: none;
}
.mode-panel.active {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

/* ========== 录音弹窗自定义 ========== */
.recording-modal-content {
    text-align: center;
    padding: 10px 0;
}

.recording-modal-content .big-mic {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 3px solid #e0e0e0;
    background: #fff;
    color: #999;
    font-size: 32px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    margin-bottom: 12px;
}

.recording-modal-content .big-mic.active {
    border-color: #f56565;
    color: #f56565;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(245,101,101,0.4); }
    70% { box-shadow: 0 0 0 15px rgba(245,101,101,0); }
    100% { box-shadow: 0 0 0 0 rgba(245,101,101,0); }
}

.recording-modal-content .rec-status {
    font-size: 14px;
    color: #666;
    margin-bottom: 16px;
}

.recording-modal-content .audio-play-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 12px 0;
}

.recording-modal-content .audio-play-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.recording-modal-content .audio-play-item button {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: #f5f5f5;
    color: #666;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.2s;
}

.recording-modal-content .audio-play-item button:hover { background: #e8f5e9; color: #20c997; }
.recording-modal-content .audio-play-item .alabel { font-size: 11px; color: #bbb; }

.recording-modal-content .rec-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
}

.recording-modal-content .rec-actions button {
    padding: 10px 28px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
}

.recording-modal-content .rec-actions .btn-retry-rec {
    background: #f5f5f5;
    color: #666;
}

.recording-modal-content .rec-actions .btn-submit-rec {
    background: linear-gradient(135deg, #20c997, #38d9a9);
    color: #fff;
    font-weight: 600;
}

/* ---- 学习内容弹窗 ---- */
.content-list {
    max-height: 400px;
    overflow-y: auto;
    text-align: left;
}
.content-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid #f5f5f5;
    transition: background 0.15s;
}
.content-item:last-child { border-bottom: none; }
.content-item:hover { background: #e8f5e9; }
.ci-index {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #20c997;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.ci-body { flex: 1; min-width: 0; }
.ci-chinese { font-size: 17px; font-weight: 600; color: #1a1a1a; }
.ci-pinyin { font-size: 13px; color: #20c997; margin-top: 2px; }

<style>

.mode-card .mode-label {

/* ---- Switch 开关组件 ---- */
.listening-toggles, .typing-toggles, .translate-toggles, .speaking-toggles, .sorting-toggles {
  display: flex; gap: 16px; padding: 4px 24px 0;
}
.listening-toggles .toggle-switch, .typing-toggles .toggle-switch, .translate-toggles .toggle-switch, .speaking-toggles .toggle-switch, .sorting-toggles .toggle-switch {
  display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
}
.listening-toggles .toggle-switch input, .typing-toggles .toggle-switch input, .translate-toggles .toggle-switch input, .speaking-toggles .toggle-switch input, .sorting-toggles .toggle-switch input { display: none; }
.listening-toggles .toggle-slider, .typing-toggles .toggle-slider, .translate-toggles .toggle-slider, .speaking-toggles .toggle-slider, .sorting-toggles .toggle-slider {
  width: 36px; height: 20px; background: #ddd; border-radius: 10px;
  position: relative; transition: background 0.2s; flex-shrink: 0;
}
.listening-toggles .toggle-slider::after, .typing-toggles .toggle-slider::after, .translate-toggles .toggle-slider::after, .speaking-toggles .toggle-slider::after, .sorting-toggles .toggle-slider::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; background: #fff; border-radius: 50%;

}
.listening-toggles .toggle-switch input:checked + .toggle-slider,
.typing-toggles .toggle-switch input:checked + .toggle-slider,
.translate-toggles .toggle-switch input:checked + .toggle-slider,
.speaking-toggles .toggle-switch input:checked + .toggle-slider,
.sorting-toggles .toggle-switch input:checked + .toggle-slider { background: #20c997; }
.listening-toggles .toggle-switch input:checked + .toggle-slider::after,
.typing-toggles .toggle-switch input:checked + .toggle-slider::after,
.translate-toggles .toggle-switch input:checked + .toggle-slider::after,
.speaking-toggles .toggle-switch input:checked + .toggle-slider::after,
.sorting-toggles .toggle-switch input:checked + .toggle-slider::after { transform: translateX(16px); }
.listening-toggles .toggle-label, .typing-toggles .toggle-label, .translate-toggles .toggle-label, .speaking-toggles .toggle-label, .sorting-toggles .toggle-label { font-size: 13px; color: #888; }

.wc-pinyin.hidden { display: none; }

/* ---- 帮助按钮 ---- */

<script>
// ===== 逐词发音：cnchar 库驱动（所有练习模式共用）=====
// 说明：使用 cnchar-data 预录音频 mp3（真人发音），替代 Qwen3 TTS 逐词朗读。
// mp3 命名规则：拼音（无调）+ 数字声调，ü → v，轻声 → 5，如 xing2.mp3 / de5.mp3 / lv4.mp3
var CNCHAR_TONE_MAP = {
  'ā': 1, 'á': 2, 'ǎ': 3, 'à': 4,
  'ē': 1, 'é': 2, 'ě': 3, 'è': 4,
  'ī': 1, 'í': 2, 'ǐ': 3, 'ì': 4,
  'ō': 1, 'ó': 2, 'ǒ': 3, 'ò': 4,
  'ū': 1, 'ú': 2, 'ǔ': 3, 'ù': 4,
  'ǖ': 1, 'ǘ': 2, 'ǚ': 3, 'ǜ': 4
};
// 带声调字母 → 无调基字母（ü 韵母转 v，与 cnchar-data 资源命名一致）
var CNCHAR_BASE_MAP = {
  'ā': 'a', 'á': 'a', 'ǎ': 'a', 'à': 'a',
  'ē': 'e', 'é': 'e', 'ě': 'e', 'è': 'e',
  'ī': 'i', 'í': 'i', 'ǐ': 'i', 'ì': 'i',
  'ō': 'o', 'ó': 'o', 'ǒ': 'o', 'ò': 'o',
  'ū': 'u', 'ú': 'u', 'ǔ': 'u', 'ù': 'u',
  'ǖ': 'v', 'ǘ': 'v', 'ǚ': 'v', 'ǜ': 'v'
};
function cncharPinyinToMp3Name(p) {
  var out = '', tone = 0;
  for (var i = 0; i < p.length; i++) {
    var c = p.charAt(i);
    if (CNCHAR_BASE_MAP[c]) {
      tone = CNCHAR_TONE_MAP[c];
      out += CNCHAR_BASE_MAP[c];
    } else {
      out += c;
    }
  }
  return out + (tone || 5);
}
// 播放单个拼音对应的 mp3（cnchar-data 预录音频），onEnd 在播放结束后回调
function playCncharAudio(p, onEnd) {
  if (!p) { if (typeof onEnd === 'function') onEnd(); return; }
  var url = 'https://unpkg.com/cnchar-data@latest/voice/' + cncharPinyinToMp3Name(p.toLowerCase()) + '.mp3';
  var audio = new Audio(url);
  audio.onended = function() { if (typeof onEnd === 'function') onEnd(); };
  audio.onerror = function() { if (typeof onEnd === 'function') onEnd(); };
  audio.play().catch(function() { if (typeof onEnd === 'function') onEnd(); });
}
// 整词逐字连播：cnchar.spell 拆成单字带声调拼音（过滤非汉字），逐个播放 mp3
function playCncharWord(word, onEnd) {
  if (!word) { if (typeof onEnd === 'function') onEnd(); return; }
  var pys = [];
  try {
    pys = cnchar.spell(word, 'array', 'tone');
  } catch (e) { pys = []; }
  // 过滤非汉字（标点/数字等 spell 会原样返回），只保留汉字拼音
  var i = 0;
  function next() {
    while (i < pys.length && !/[一-鿿]/.test(String(word).charAt(i))) { i++; }
    if (i >= pys.length) { if (typeof onEnd === 'function') onEnd(); return; }
    var p = pys[i];
    var cur = i;
    i++;
    playCncharAudio(p, function() {
      setTimeout(next, 150);
    });
  }
  next();
}

// ===== 练习模式切换 =====
function showModeSwitcher() {
  var modes = [
    {key:'typing', icon:'fa-keyboard', label:'打字练习', desc:'看英文提示，输入中文', url:'?mode=typing'},
    {key:'speaking', icon:'fa-microphone', label:'口语练习', desc:'跟读句子，AI评分', url:'?mode=speaking'},
    {key:'translate', icon:'fa-language', label:'英译中', desc:'将英文翻译成中文', url:'?mode=translate'},
    {key:'listening', icon:'fa-headphones', label:'听力', desc:'听音频理解句子', url:'?mode=listening'},
    {key:'sorting', icon:'fa-puzzle-piece', label:'拆句重组', desc:'将打乱的词语排列成正确句子', url:'sorting/'},
    {key:'writing', icon:'fa-pen-nib', label:'写字模式', desc:'手写练习汉字笔画与结构', url:'writing/'},
  ];
  var lessonId = Number("{{ lesson.id }}");
  var curPath = window.location.pathname;
  var curMode = 'listening';
  if (curPath.indexOf('/sorting/') !== -1) {
    curMode = 'sorting';
  } else if (curPath.indexOf('/writing/') !== -1) {
    curMode = 'writing';
  } else {
    curMode = new URLSearchParams(window.location.search).get('mode') || 'listening';
  }
  var html = '<div class="mode-grid">';
  modes.forEach(function(m) {
    var active = m.key === curMode ? ' active' : '';
    html += '<div class="mode-card' + active + '" onclick="switchMode(\'/practiceApp/' + lessonId + '/' + m.url + '\')">';
    html += '<div class="icon-wrap ' + m.key + '"><i class="fas ' + m.icon + '"></i></div>';
    html += '<div class="mode-label">' + m.label + '</div>';
    html += '<div class="mode-desc">' + m.desc + '</div>';
    html += '</div>';
  });
  html += '</div>';
  Swal.fire({title:'选择练习模式', html:html, showConfirmButton:false, showCloseButton:true, width:440, padding:'8px 16px 20px'});
}

function confirmReset() {
  Swal.fire({title:'确认重置', text:'将跳转到本课时第一句，确定吗？', icon:'question', showCancelButton:true, confirmButtonText:'确定', cancelButtonText:'取消', confirmButtonColor:'#20c997'}).then(function(r){ if(r.isConfirmed && typeof toast==='function') toast('重置进度'); });
}

// ===== 设置菜单（所有页面共享）=====
const TTS_VOICES = [
  {key:'Cherry', label:'芊悦（默认）', desc:'温柔自然女声，适合朗读', emoji:'👩'},
  {key:'Ethan', label:'晨煦', desc:'温暖男声，沉稳有力', emoji:'👨'},
  {key:'Jennifer', label:'詹妮弗', desc:'清晰女声，适合教学', emoji:'👩'},
  {key:'Ryan', label:'甜茶', desc:'年轻男声，充满活力', emoji:'🧑'},
  {key:'Katerina', label:'卡捷琳娜', desc:'知性女声，语速适中', emoji:'👩'},
  {key:'Elias', label:'墨讲师', desc:'正式男声，适合讲座', emoji:'👨'},
  {key:'Serena', label:'塞雷娜', desc:'甜美女声，语气亲切', emoji:'👩'},
  {key:'Nofish', label:'不吃鱼', desc:'俏皮活力女声', emoji:'🧑'},
  {key:'Chelsie', label:'切尔西', desc:'自然对话感女声', emoji:'👩'},
  {key:'Sunny', label:'Sunny', desc:'四川方言女声', emoji:'🗣'},
  {key:'Dylan', label:'Dylan', desc:'北京话男声', emoji:'🗣'},
  {key:'Jada', label:'Jada', desc:'上海沪语女声', emoji:'🗣'},
  {key:'Rocky', label:'Rocky', desc:'粤语男声', emoji:'🗣'},
  {key:'Roy', label:'Roy', desc:'闽南语男声', emoji:'🗣'},
];

function showVoiceSettings() {
  var curVoice = localStorage.getItem('qwen3_voice') || 'Cherry';
  var activeTab = 'pron';
  function renderTab(tab) {
    activeTab = tab;
    var tabs = ['发音','音效','答题','听力','个性化','快捷键'];
    var keys = ['pron','sound','quiz','listen','personal','shortcut'];
    var h = '<div style="display:flex;border-bottom:1px solid #eee;margin-bottom:14px;overflow-x:auto;">';
    tabs.forEach(function(t,i){var k=keys[i];h+='<div onclick="renderSettingsTab(\''+k+'\')" style="padding:8px 14px;cursor:pointer;font-size:13px;white-space:nowrap;border-bottom:2px solid '+(k===activeTab?'#20c997':'transparent')+';color:'+(k===activeTab?'#20c997':'#999')+';font-weight:'+(k===activeTab?'600':'400')+';">'+t+'</div>';});
    h += '</div>';
    var c = '';
    if (tab === 'pron') {
      var sv=localStorage.getItem('qwen3_voice')||'Cherry';
      if(!TTS_VOICES.some(function(v){return v.key===sv;})){sv='Cherry';localStorage.setItem('qwen3_voice','Cherry');}
      var spd=localStorage.getItem('qwen3_speed')||'1.0',vol=localStorage.getItem('qwen3_volume')||'0.8',rpt=localStorage.getItem('qwen3_repeat')||'1',ivl=localStorage.getItem('qwen3_interval')||'1.0';
      var aR=localStorage.getItem('qwen3_auto_read')!=='0',rC=localStorage.getItem('qwen3_read_correct')!=='0';
      c+='<div style="border:1px solid #e0e0e0;border-radius:10px;padding:14px;margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#20c997;margin-bottom:10px;">发音设置</div>';
      c+='<div style="margin-bottom:12px;text-align:left;"><label style="font-size:13px;font-weight:600;color:#333;display:block;margin-bottom:6px;">朗读音色</label><select onchange="selectVoice(this.value)" style="width:100%;padding:10px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;background:#fff;">';
      TTS_VOICES.forEach(function(v){c+='<option value="'+v.key+'"'+(v.key===sv?' selected':'')+'>'+v.emoji+' '+v.label+' - '+v.desc+'</option>';});
      var em=localStorage.getItem('qwen3_emotion')||'无';
      c+='</select></div><div style="margin-bottom:12px;text-align:left;"><label style="font-size:13px;font-weight:600;color:#333;display:block;margin-bottom:6px;">朗读情绪</label><select onchange="localStorage.setItem(\'qwen3_emotion\',this.value)" style="width:100%;padding:10px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;background:#fff;">';
      [{k:'无',l:'无 (默认)'},{k:'开心',l:'😊 开心'},{k:'亲切',l:'🤗 亲切'},{k:'温柔',l:'💕 温柔'},{k:'活泼',l:'🎉 活泼'},{k:'严肃',l:'📚 严肃'},{k:'悲伤',l:'😢 悲伤'},{k:'生气',l:'😤 生气'},{k:'惊讶',l:'😮 惊讶'}].forEach(function(e){c+='<option value="'+e.k+'"'+(e.k===em?' selected':'')+'>'+e.l+'</option>';});
      c+='</select></div>';
      c+='<div style="margin-bottom:10px;text-align:left;"><label style="font-size:13px;font-weight:600;color:#333;display:block;margin-bottom:6px;">朗读语速</label><input type="range" min="0.5" max="2.0" step="0.1" value="'+spd+'" oninput="updateSpeed(this.value)" style="width:100%;"><div style="display:flex;justify-content:space-between;font-size:12px;color:#bbb;"><span>慢</span><span id="speedVal" style="color:#20c997;font-weight:600;">'+spd+'</span><span>快</span></div></div>';
      c+='<div style="margin-bottom:10px;text-align:left;"><label style="font-size:13px;font-weight:600;color:#333;display:block;margin-bottom:6px;">发音音量</label><input type="range" min="0" max="1" step="0.1" value="'+vol+'" oninput="updateVolume(this.value)" style="width:100%;"><div style="display:flex;justify-content:space-between;font-size:12px;color:#bbb;"><span>静音</span><span id="volumeVal" style="color:#20c997;font-weight:600;">'+Math.round(vol*100)+'%</span><span>最大</span></div></div>';
      c+='<div style="margin-bottom:10px;text-align:left;"><label style="font-size:13px;font-weight:600;color:#333;display:block;margin-bottom:6px;">朗读次数</label><div style="display:flex;gap:8px;">';
      for(var r=1;r<=5;r++){c+='<div onclick="updateRepeat('+r+')" style="flex:1;padding:8px 0;border-radius:8px;text-align:center;cursor:pointer;font-size:14px;font-weight:600;'+(r==rpt?'background:#20c997;color:#fff;':'background:#f5f5f5;color:#888;')+'">'+r+'</div>';}
      c+='</div></div>';
      c+='<div style="margin-bottom:10px;text-align:left;"><label style="font-size:13px;font-weight:600;color:#333;display:block;margin-bottom:6px;">朗读间隔（秒）</label><input type="range" min="0.5" max="3.0" step="0.5" value="'+ivl+'" oninput="updateInterval(this.value)" style="width:100%;"><div style="display:flex;justify-content:space-between;font-size:12px;color:#bbb;"><span>0.5s</span><span id="intervalVal" style="color:#20c997;font-weight:600;">'+ivl+'s</span><span>3s</span></div></div>';
      c+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;"><span style="font-size:14px;color:#333;">切题后自动朗读</span><div onclick="var v=localStorage.getItem(\'qwen3_auto_read\')!==\'0\'?\'0\':\'1\';localStorage.setItem(\'qwen3_auto_read\',v);renderSettingsTab(\'pron\')" style="width:44px;height:24px;border-radius:12px;cursor:pointer;position:relative;'+(aR?'background:#20c997;':'background:#ddd;')+'"><div style="width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;transition:all 0.2s;'+(aR?'left:22px;':'left:2px;')+'"></div></div></div>';
      c+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;"><span style="font-size:14px;color:#333;">答题正确后朗读</span><div onclick="var v=localStorage.getItem(\'qwen3_read_correct\')!==\'0\'?\'0\':\'1\';localStorage.setItem(\'qwen3_read_correct\',v);renderSettingsTab(\'pron\')" style="width:44px;height:24px;border-radius:12px;cursor:pointer;position:relative;'+(rC?'background:#20c997;':'background:#ddd;')+'"><div style="width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;transition:all 0.2s;'+(rC?'left:22px;':'left:2px;')+'"></div></div></div>';
      c+='</div>';
    } else if (tab === 'sound') {c+='<div style="padding:20px 0;text-align:center;color:#ccc;"><i class="fas fa-volume-up" style="font-size:36px;display:block;margin-bottom:8px;"></i><p style="font-size:14px;margin:0;">音效设置（开发中）</p></div>';}
    else if (tab === 'quiz') {c+='<div style="padding:20px 0;text-align:center;color:#ccc;"><i class="fas fa-pencil-alt" style="font-size:36px;display:block;margin-bottom:8px;"></i><p style="font-size:14px;margin:0;">答题设置（开发中）</p></div>';}
    else if (tab === 'listen') {c+='<div style="padding:20px 0;text-align:center;color:#ccc;"><i class="fas fa-headphones" style="font-size:36px;display:block;margin-bottom:8px;"></i><p style="font-size:14px;margin:0;">听力设置（开发中）</p></div>';}
    else if (tab === 'personal') {
      var th=localStorage.getItem('qwen3_theme')||'day';
      c+='<div style="text-align:left;"><label style="font-size:13px;font-weight:600;color:#333;display:block;margin-bottom:10px;">主题选择</label>';
      c+='<div onclick="selectTheme(\'day\')" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;margin-bottom:8px;cursor:pointer;'+(th==='day'?'background:#e8f5e9;border:2px solid #20c997;':'background:#f5f5f5;border:2px solid transparent;')+'"><div style="width:20px;height:20px;border-radius:50%;border:2px solid '+(th==='day'?'#20c997':'#ccc')+';display:flex;align-items:center;justify-content:center;"><div style="width:10px;height:10px;border-radius:50%;background:'+(th==='day'?'#20c997':'transparent')+';"></div></div><div style="font-size:14px;color:#1a1a1a;">☀️ 白天模式</div></div>';
      c+='<div onclick="selectTheme(\'night\')" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;margin-bottom:8px;cursor:pointer;'+(th==='night'?'background:#e8f5e9;border:2px solid #20c997;':'background:#f5f5f5;border:2px solid transparent;')+'"><div style="width:20px;height:20px;border-radius:50%;border:2px solid '+(th==='night'?'#20c997':'#ccc')+';display:flex;align-items:center;justify-content:center;"><div style="width:10px;height:10px;border-radius:50%;background:'+(th==='night'?'#20c997':'transparent')+';"></div></div><div style="font-size:14px;color:#1a1a1a;">🌙 夜间模式</div></div>';
      c+='</div>';
      var ss=localStorage.getItem('spectrum_style')||'bars';var sl=[{k:'bars',i:'fa-chart-bar',l:'柱状'},{k:'wave',i:'fa-wave-square',l:'波形'},{k:'circle',i:'fa-circle',l:'圆形'}];
      c+='<div style="margin-top:16px;text-align:left;"><label style="font-size:13px;font-weight:600;color:#333;display:block;margin-bottom:10px;">频谱样式</label><div style="display:flex;gap:8px;">';
      sl.forEach(function(s){var a=s.k===ss;c+='<div onclick="selectSpectrumStyle(\''+s.k+'\')" style="padding:6px 14px;border-radius:6px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;display:inline-block;'+(a?'background:#20c997;color:#fff;':'background:#f5f5f5;color:#888;')+'"><i class="fas '+s.i+'" style="font-size:14px;margin-right:3px;"></i>'+s.l+'</div>';});
      c+='</div></div>';
    } else if (tab === 'shortcut') {c+='<div style="padding:20px 0;text-align:center;color:#ccc;"><i class="fas fa-keyboard" style="font-size:36px;display:block;margin-bottom:8px;"></i><p style="font-size:14px;margin:0;">快捷键设置（开发中）</p></div>';}
    return h + c;
  }
  window.renderSettingsTab = function(tab){var html=renderTab(tab);var pop=document.querySelector('.swal2-html-container');if(pop)pop.innerHTML=html;};
  Swal.fire({title:'设置', html:renderTab('pron'), showConfirmButton:false, showCloseButton:true, width:480});
}
function selectVoice(k){localStorage.setItem('qwen3_voice',k);}
function updateSpeed(v){localStorage.setItem('qwen3_speed',v);var e=document.getElementById('speedVal');if(e)e.textContent=v;}
function updateVolume(v){localStorage.setItem('qwen3_volume',v);var e=document.getElementById('volumeVal');if(e)e.textContent=Math.round(v*100)+'%';}
function updateRepeat(v){localStorage.setItem('qwen3_repeat',v);if(typeof renderSettingsTab==='function')renderSettingsTab('pron');}
function updateInterval(v){localStorage.setItem('qwen3_interval',v);var e=document.getElementById('intervalVal');if(e)e.textContent=v+'s';}
function selectTheme(t){localStorage.setItem('qwen3_theme',t);applyTheme();if(typeof renderSettingsTab==='function')renderSettingsTab('personal');}
function applyTheme(){var b=document.body;var t=localStorage.getItem('qwen3_theme')||'day';b.classList.remove('theme-day','theme-night');b.classList.add('theme-'+t);}
</script>

<script>
// ===== 频谱样式切换（全局可用）=====
function selectSpectrumStyle(s) {
  localStorage.setItem('spectrum_style', s);
  if (typeof SpectrumVisualizer !== 'undefined' && SpectrumVisualizer.setStyle) {
    SpectrumVisualizer.setStyle(s);
  }
  if (typeof renderSettingsTab === 'function') renderSettingsTab('personal');
}

// 页面加载时应用主题
document.addEventListener('DOMContentLoaded', function() { if (typeof applyTheme === 'function') applyTheme(); });

// ===== 底部频谱 =====
(function(){
  var canvas = document.getElementById('bottomSpectrum');
  if (!canvas || typeof SpectrumVisualizer === 'undefined') return;

  function resizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth || 720;
    canvas.width = w * dpr;
    canvas.height = 40 * dpr;
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  var savedStyle = localStorage.getItem('spectrum_style') || 'bars';
  var sv = SpectrumVisualizer.init({
    style: savedStyle, fftSize: 128, barWidth: 6, barGap: 2, color: '#20c997'
  }).setCanvas(canvas);
  sv.start();

  // 全局方法：连接音频元素到频谱
  window.connectAudioToSpectrum = function(audioEl, onEnd) {
    if (!audioEl) return;
    sv.connectAudio(audioEl).then(function() {
      sv.setPlaying(true);
      audioEl.addEventListener('ended', function() { sv.setPlaying(false); if (typeof onEnd === 'function') onEnd(); });
      audioEl.addEventListener('pause', function() { sv.setPlaying(false); });
    });
  };

  // 监听 VoicePlayer 音频
  var _origSpeak = VoicePlayer.speak;
  VoicePlayer.speak = function(text, opts) {
    opts = opts || {};
    var self = this;
    // 在音频开始后连接 spectrum
    var origOnStart = opts.onStart;
    opts.onStart = function() {
      if (typeof origOnStart === 'function') origOnStart();
      // 延迟使 audio 元素就绪
      setTimeout(function() {
        if (self.currentAudio) {
          sv.connectAudio(self.currentAudio).then(function() {
            sv.setPlaying(true);
            self.currentAudio.addEventListener('ended', function() { sv.setPlaying(false); });
          });
        }
      }, 100);
    };
    _origSpeak.call(self, text, opts);
  };
})();

// ===== 学习计时功能（6 种练习模式通用，继承 pra_base 即生效）=====
var studyTimer = null, studyStart = null, studyElapsed = 0, restWarned = false;

function fmtHHMMSS(total) {
  var h = Math.floor(total / 3600);
  var m = Math.floor((total % 3600) / 60);
  var s = total % 60;
  return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
function updateStudyClock() {
  var el = document.getElementById('studyTime');
  if (!el || studyStart === null) return;
  var secs = studyElapsed + Math.floor((Date.now() - studyStart) / 1000);
  el.textContent = fmtHHMMSS(secs);
  // 休息提醒：累计 30 分钟
  if (!restWarned && secs >= 1800) {
    restWarned = true;
    Swal.fire({icon: 'warning', title: '⏰ 休息提醒', html: '<div style="font-size:15px;color:#555;line-height:1.8;">已经连续学习 <b style="color:#f57c00;">30 分钟</b> 啦，<br>请休息一下，远眺放松眼睛，保护视力～</div>', confirmButtonText: '好的', confirmButtonColor: '#20c997'});
  }
}
function startStudyTimer() {
  if (studyStart !== null) return;
  studyStart = Date.now();
  studyTimer = setInterval(updateStudyClock, 1000);
  updateStudyClock();
}
function stopStudyTimer() {
  if (studyStart !== null) {
    studyElapsed += Math.floor((Date.now() - studyStart) / 1000);
    studyStart = null;
  }
  if (studyTimer) { clearInterval(studyTimer); studyTimer = null; }
}
// ===== 学习时长存储接口（占位，待用户模型实现后接入）=====
// 说明：用户模型尚未实现。此函数为后续「学习时间统计」功能预留存储入口，
// 待 userApp.UserInfo 与学习统计表建立后，在此将本次学习时长写入后端。
function saveStudyTime(minutes) {
  // TODO: 用户模型实现后，将本次学习时长持久化（如 POST /api/study/record/ {mode, duration_minutes}）
  try { console.log('[学习计时] 本次 ' + minutes + ' 分钟'); } catch (e) {}
}
// 结算：停止计时 + 存储 + （可选）弹窗展示本次累计时长
function settleStudy(showModal) {
  stopStudyTimer();
  var total = studyElapsed;
  studyElapsed = 0;
  restWarned = false;
  if (total <= 0) return;
  saveStudyTime(Math.round(total / 60));
  if (showModal && window.Swal) {
    Swal.fire({icon: 'info', title: '⏱ 本次学习结算', html: '<div style="font-size:15px;color:#555;">本模式累计学习时长：<b style="color:#2563eb;font-size:20px;">' + fmtHHMMSS(total) + '</b></div><div style="font-size:12px;color:#999;margin-top:4px;">休息一下，保护眼睛～</div>', confirmButtonText: '知道了', confirmButtonColor: '#20c997'});
  }
}
// 切换模式 / 返回课时列表：先结算弹窗，再延迟跳转
function switchMode(url) {
  settleStudy(true);
  setTimeout(function() { window.location.href = url; }, 1500);
}
function goBackToCourse(url) {
  settleStudy(true);
  setTimeout(function() { window.location.href = url; }, 1500);
}
// 离开页面（关闭/刷新/直接跳转）时兜底存储
window.addEventListener('pagehide', function() { settleStudy(false); });

// 注入时钟图标到开关行（拼音开关右侧）并启动计时
(function initStudyClock() {
  var toggles = document.querySelector('.typing-toggles, .translate-toggles, .sorting-toggles, .speaking-toggles, .listening-toggles');
  if (!toggles) return;
  var clockEl = document.createElement('div');
  clockEl.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:13px;color:#888;margin-left:4px;user-select:none;';
  clockEl.innerHTML = '<i class="fas fa-stopwatch" style="font-size:16px;color:#20c997;"></i><span id="studyTime" style="font-weight:600;font-variant-numeric:tabular-nums;">00:00:00</span>';
  var pinyin = document.getElementById('togglePinyin');
  if (pinyin) {
    var sw = pinyin.closest('.toggle-switch');
    if (sw) sw.after(clockEl);
    else toggles.appendChild(clockEl);
  } else {
    toggles.appendChild(clockEl);
  }
  startStudyTimer();
})();
</script>
